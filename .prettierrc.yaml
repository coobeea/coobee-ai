trailingComma: none
bracketSpacing: true
embeddedLanguageFormatting: auto
arrowParens: always
requirePragma: false
insertPragma: false
proseWrap: preserve
htmlWhitespaceSensitivity: strict
vueIndentScriptAndStyle: false
