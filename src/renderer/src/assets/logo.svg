<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD740;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFAB40;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#263238;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#37474F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#455A64;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.3)"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#backgroundGradient)" filter="url(#shadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <g transform="translate(256, 256) scale(15, 15)" filter="url(#glow)">
    <path d="M15 2a1 1 0 0 1 1 1v1h1a3 3 0 0 1 3 3v1h1a1 1 0 1 1 0 2h-1v4h1a1 1 0 1 1 0 2h-1v1a3 3 0 0 1-3 3h-1v1a1 1 0 1 1-2 0v-1h-4v1a1 1 0 1 1-2 0v-1H7a3 3 0 0 1-3-3v-1H3a1 1 0 1 1 0-2h1v-4H3a1 1 0 1 1 0-2h1V7a3 3 0 0 1 3-3h1V3a1 1 0 1 1 2 0v1h4V3a1 1 0 0 1 1-1"
          fill="url(#secondaryGradient)"
          opacity="0.4"
          transform="translate(-12, -12)"/>
    
    <path d="M14 8h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2"
          fill="url(#primaryGradient)"
          transform="translate(-12, -12)"/>
  </g>

  <g opacity="0.6">
    <circle cx="128" cy="128" r="8" fill="url(#secondaryGradient)"/>
    <circle cx="384" cy="128" r="8" fill="url(#secondaryGradient)"/>
    <circle cx="128" cy="384" r="8" fill="url(#secondaryGradient)"/>
    <circle cx="384" cy="384" r="8" fill="url(#secondaryGradient)"/>
  </g>

  <rect x="32" y="32" width="448" height="448" rx="64" ry="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>
